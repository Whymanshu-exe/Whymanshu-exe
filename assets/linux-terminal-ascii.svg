<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-labelledby="title description">
  <title id="title">Linux terminal ASCII art</title>
  <desc id="description">A colorful ASCII terminal window for himanshu at workstation.</desc>
  <rect x="1" y="1" width="718" height="268" rx="14" fill="#10131a" stroke="#39404d" stroke-width="2"/>
  <path d="M2 42h716" stroke="#39404d" stroke-width="2"/>
  <circle cx="24" cy="22" r="6" fill="#e95420"/>
  <circle cx="46" cy="22" r="6" fill="#e5b567"/>
  <circle cx="68" cy="22" r="6" fill="#62c554"/>
  <text x="360" y="28" fill="#9ba4b5" font-family="monospace" font-size="13" text-anchor="middle">himanshu@workstation: ~</text>
  <g font-family="monospace" font-size="18" font-weight="700" xml:space="preserve">
    <text x="42" y="82" fill="#e95420">       .------------------------------------------.</text>
    <text x="42" y="110" fill="#d8dee9">      /  <tspan fill="#62c554">himanshu@workstation</tspan>                      \</text>
    <text x="42" y="138" fill="#d8dee9">     |  <tspan fill="#e95420">$</tspan> uname -o                               |</text>
    <text x="42" y="166" fill="#d8dee9">     |  <tspan fill="#62c554">Linux</tspan>                                     |</text>
    <text x="42" y="194" fill="#d8dee9">     |  <tspan fill="#e95420">$</tspan> make things <tspan fill="#5bc0eb">--learn-as-you-go</tspan>          |</text>
    <text x="42" y="222" fill="#d8dee9">      \__________________________________________/</text>
  </g>
  <text x="658" y="248" fill="#788394" font-family="monospace" font-size="12" text-anchor="end">LINUX NERD // USER MODE</text>
</svg>
